version: 2.1

orbs:
  node: circleci/node@6.1.0

# ──────────────────────────────────────────────
# Reusable executors
# ──────────────────────────────────────────────
executors:
  node_executor:
    docker:
      - image: cimg/node:22.15
    resource_class: medium

  android_executor:
    docker:
      - image: cimg/android:2026.03-node
    resource_class: large
    environment:
      GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g
      NPM_CONFIG_CACHE: /home/circleci/project/.npm-cache
      NODE_ENV: production
      CI: "true"

# ──────────────────────────────────────────────
# Jobs
# ──────────────────────────────────────────────
jobs:

  # ── 1. Install dependencies ──────────────────
  install:
    executor: node_executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-cache-v2-{{ checksum "package-lock.json" }}
            - npm-cache-v2-

      - run:
          name: Install Node dependencies
          command: npm ci --legacy-peer-deps --prefer-offline --no-audit

      - save_cache:
          key: npm-cache-v2-{{ checksum "package-lock.json" }}
          paths:
            - .npm-cache
            - node_modules

      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  # ── 2. Lint ──────────────────────────────────
  lint:
    executor: node_executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Run ESLint (expo lint)
          command: npm run lint

      - run:
          name: TypeScript type-check
          command: npm run typecheck

  # ── 3. Android release APK build ─────────────
  build_android:
    executor: android_executor
    steps:
      - checkout

      - run:
          name: Initialize timing + state
          command: |
            {
              echo "export JOB_START_TS=$(date +%s)"
              echo "export INSTALL_SECONDS=0"
              echo "export PREBUILD_SECONDS=0"
              echo "export LOCAL_BUILD_SECONDS=0"
            } >> "$BASH_ENV"

      - restore_cache:
          keys:
            - npm-cache-v2-{{ checksum "package-lock.json" }}
            - npm-cache-v2-

      - run:
          name: Install Node dependencies
          command: |
            source "$BASH_ENV"
            START_TS=$(date +%s)
            npm ci --legacy-peer-deps --prefer-offline --no-audit
            END_TS=$(date +%s)
            echo "export INSTALL_SECONDS=$((END_TS - START_TS))" >> "$BASH_ENV"

      - save_cache:
          key: npm-cache-v2-{{ checksum "package-lock.json" }}
          paths:
            - .npm-cache

      - run:
          name: Validate build-time app env
          command: |
            if [ -z "$EXPO_PUBLIC_API_URL" ] || [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
              echo "ERROR: Missing EXPO_PUBLIC_API_URL or EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY."
              exit 1
            fi

      - run:
          name: Install native build tools (Ninja + CMake)
          no_output_timeout: 15m
          command: |
            sudo apt-get update -q
            sudo apt-get install -y ninja-build cmake
            ninja --version
            cmake --version

      - restore_cache:
          keys:
            - gradle-cache-v5-{{ checksum "package-lock.json" }}-{{ checksum "app.json" }}
            - gradle-cache-v5-{{ checksum "package-lock.json" }}-
            - gradle-cache-v5-

      - run:
          name: Generate Android project (expo prebuild)
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            START_TS=$(date +%s)
            export EXPO_DEBUG=1
            timeout 20m npx expo prebuild --platform android --non-interactive --no-install
            END_TS=$(date +%s)
            echo "export PREBUILD_SECONDS=$((END_TS - START_TS))" >> "$BASH_ENV"

      - run:
          name: Validate generated Android permissions
          command: |
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            if [ ! -f "$MANIFEST" ]; then
              echo "AndroidManifest.xml not found at $MANIFEST"
              exit 1
            fi
            FORBIDDEN=(
              "android.permission.RECORD_AUDIO"
              "android.permission.SYSTEM_ALERT_WINDOW"
              "android.permission.READ_EXTERNAL_STORAGE"
              "android.permission.WRITE_EXTERNAL_STORAGE"
            )
            for perm in "${FORBIDDEN[@]}"; do
              if awk -v perm="$perm" '
                /<uses-permission/ && index($0, "android:name=\"" perm "\"") && index($0, "tools:node=\"remove\"") == 0 { found=1 }
                END { exit found ? 0 : 1 }
              ' "$MANIFEST"; then
                echo "Forbidden permission effectively present in manifest: $perm"
                exit 1
              fi
            done
            echo "Permission validation passed."

      - run:
          name: Decode Android keystore
          command: |
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
               [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "ERROR: Missing one or more Android signing secrets."
              exit 1
            fi
            mkdir -p android/app/keystores
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/release.keystore

      - run:
          name: Configure Gradle signing and CI tuning
          command: |
            sed -i '/^MYAPP_UPLOAD_/d;/^android.packagingOptions.pickFirsts=/d;/^org.gradle.parallel=/d;/^org.gradle.caching=/d;/^org.gradle.configuration-cache=/d;/^org.gradle.configuration-cache.problems=/d;/^org.gradle.jvmargs=/d;/^org.gradle.workers.max=/d;/^org.gradle.daemon=/d' android/gradle.properties || true
            {
              echo "MYAPP_UPLOAD_STORE_FILE=app/keystores/release.keystore"
              echo "MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
              echo "android.packagingOptions.pickFirsts=META-INF/versions/9/OSGI-INF/MANIFEST.MF"
              echo "org.gradle.parallel=false"
              echo "org.gradle.caching=true"
              echo "org.gradle.configuration-cache=false"
              echo "org.gradle.configuration-cache.problems=warn"
              echo "org.gradle.daemon=false"
              echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m"
              echo "org.gradle.workers.max=2"
              echo "kotlin.compiler.execution.strategy=in-process"
            } >> android/gradle.properties

      - run:
          name: Build release APK
          no_output_timeout: 45m
          command: |
            source "$BASH_ENV"
            START_TS=$(date +%s)
            cd android
            ./gradlew assembleRelease \
              --no-daemon \
              --build-cache \
              --max-workers=2 \
              -x lint \
              -x lintVitalRelease \
              -x lintVitalAnalyzeRelease
            END_TS=$(date +%s)
            echo "export LOCAL_BUILD_SECONDS=$((END_TS - START_TS))" >> "$BASH_ENV"

      - run:
          name: Prune Gradle cache before save
          when: always
          command: |
            rm -rf ~/.gradle/caches/transforms-* || true
            rm -rf ~/.gradle/caches/*/executionHistory || true
            rm -rf ~/.gradle/caches/build-cache-* || true
            rm -rf ~/.gradle/caches/journal-1 || true

      - save_cache:
          key: gradle-cache-v5-{{ checksum "package-lock.json" }}-{{ checksum "app.json" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Build timing summary
          when: always
          command: |
            source "$BASH_ENV"
            NOW_TS=$(date +%s)
            TOTAL_SECONDS=$((NOW_TS - JOB_START_TS))
            mkdir -p artifacts
            {
              echo "Android release build timing"
              echo "install_seconds=${INSTALL_SECONDS}"
              echo "prebuild_seconds=${PREBUILD_SECONDS}"
              echo "local_build_seconds=${LOCAL_BUILD_SECONDS}"
              echo "total_seconds=${TOTAL_SECONDS}"
            } | tee artifacts/timing-summary.txt

      - store_artifacts:
          path: artifacts/timing-summary.txt
          destination: timing-summary.txt

      - store_artifacts:
          path: android/app/build/outputs/apk/release/app-release.apk
          destination: bascybrosmobile-release.apk

      - run:
          name: Cleanup signing artifacts
          when: always
          command: |
            rm -f android/app/keystores/release.keystore || true
            sed -i '/^MYAPP_UPLOAD_/d' android/gradle.properties || true

# ──────────────────────────────────────────────
# Workflows
# ──────────────────────────────────────────────
workflows:

  # CI: lint + type-check on every push to main/develop/feature branches
  ci:
    jobs:
      - install:
          filters:
            branches:
              only:
                - master
                - main
                - develop
                - /^feature\/.*/
                - /^fix\/.*/
                - /^hotfix\/.*/
      - lint:
          requires:
            - install
          filters:
            branches:
              only:
                - master
                - main
                - develop
                - /^feature\/.*/
                - /^fix\/.*/
                - /^hotfix\/.*/

  # Release: full Android APK build triggered only on version tags (e.g. v1.2.3)
  release_android_apk:
    jobs:
      - build_android:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

