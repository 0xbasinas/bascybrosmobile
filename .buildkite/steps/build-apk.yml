steps:
  - label: ":npm: :expo: Install & prebuild"
    key: setup
    agents:
      queue: default
    env:
      CI: "true"
      NODE_ENV: production
    command: |
      set -euo pipefail

      # ── Node.js version — upgrade to 22 LTS via the `n` version manager ────────
      # `n` installs as a plain npm package so no curl/sudo/nvm needed.
      npm install -g n
      n 22
      hash -r          # make the shell pick up the newly installed node binary
      echo "Node now: $$(node -v)"

      # ── Env validation ───────────────────────────────────────────────────────
      if [ -z "$${EXPO_PUBLIC_API_URL:-}" ]; then
        export EXPO_PUBLIC_API_URL="$$(buildkite-agent secret get EXPO_PUBLIC_API_URL 2>/dev/null || true)"
      fi
      if [ -z "$${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
        export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="$$(buildkite-agent secret get EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY 2>/dev/null || true)"
      fi
      if [ -z "$${EXPO_PUBLIC_API_URL:-}" ] || [ -z "$${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
        echo "Missing EXPO_PUBLIC_API_URL or EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY."
        echo "Set them in Pipeline Settings > Environment Variables, or add them to Buildkite Secrets."
        exit 1
      fi

      # ── npm install ──────────────────────────────────────────────────────────
      START_TS=$$(date +%s)
      npm ci --legacy-peer-deps --prefer-offline --no-audit
      END_TS=$$(date +%s)
      INSTALL_SECONDS=$$((END_TS - START_TS))
      echo "npm install took $${INSTALL_SECONDS}s"
      buildkite-agent meta-data set install_seconds "$$INSTALL_SECONDS"

      # ── Expo prebuild ────────────────────────────────────────────────────────
      SHOULD_PREBUILD="$$(buildkite-agent meta-data get should_prebuild)"
      if [ "$$SHOULD_PREBUILD" != "true" ]; then
        echo "Skipping expo prebuild: no prebuild-impacting files changed."
        buildkite-agent meta-data set prebuild_seconds "0"
        exit 0
      fi

      START_TS=$$(date +%s)
      # CI=1 is already set in env; --non-interactive is not valid for this expo version
      npx expo prebuild --platform android
      END_TS=$$(date +%s)
      PREBUILD_SECONDS=$$((END_TS - START_TS))
      echo "expo prebuild took $${PREBUILD_SECONDS}s"
      buildkite-agent meta-data set prebuild_seconds "$$PREBUILD_SECONDS"

  - label: ":shield: :hammer: Validate & build APK"
    key: gradle-build
    depends_on: setup
    agents:
      queue: default
    env:
      CI: "true"
      # Medium hosted agent = 16 GB RAM. Give Gradle 6 GB heap with a separate
      # Kotlin daemon capped at 2 GB, leaving plenty for the OS and Node.
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g"
    artifact_paths:
      - "android/app/build/outputs/apk/release/app-release.apk"
    command: |
      set -euo pipefail

      # ── Node.js 22 LTS ───────────────────────────────────────────────────────
      npm install -g n
      n 22
      hash -r
      echo "Node now: $$(node -v)"

      # ── Java 17 (Buildkite Linux image ships without Java) ───────────────────
      if ! command -v java &>/dev/null; then
        echo "Installing OpenJDK 17..."
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends openjdk-17-jdk
      fi
      export JAVA_HOME="$$(dirname $$(dirname $$(readlink -f $$(which java))))"
      export PATH="$$JAVA_HOME/bin:$$PATH"
      echo "Java: $$(java -version 2>&1 | head -1)"

      # ── Android SDK (download command-line tools + required SDK components) ──
      export ANDROID_HOME="$${HOME}/android-sdk"
      export ANDROID_SDK_ROOT="$$ANDROID_HOME"
      export PATH="$$ANDROID_HOME/cmdline-tools/latest/bin:$$ANDROID_HOME/platform-tools:$$PATH"

      if [ ! -d "$$ANDROID_HOME/cmdline-tools/latest" ]; then
        echo "Installing Android SDK command-line tools..."
        mkdir -p "$$ANDROID_HOME/cmdline-tools"
        curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
          -o /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extract
        mv /tmp/cmdtools-extract/cmdline-tools "$$ANDROID_HOME/cmdline-tools/latest"
        rm -rf /tmp/cmdtools-extract /tmp/cmdtools.zip
      fi

      echo "Accepting SDK licenses and installing SDK components..."
      yes | sdkmanager --licenses > /dev/null 2>&1 || true
      sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;26.1.10909125" > /dev/null

      echo "Android SDK ready at $$ANDROID_HOME"

      # ── Env validation ───────────────────────────────────────────────────────
      if [ -z "$${EXPO_PUBLIC_API_URL:-}" ]; then
        export EXPO_PUBLIC_API_URL="$$(buildkite-agent secret get EXPO_PUBLIC_API_URL 2>/dev/null || true)"
      fi
      if [ -z "$${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
        export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="$$(buildkite-agent secret get EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY 2>/dev/null || true)"
      fi

      # ── Android signing secrets ──────────────────────────────────────────────
      for secret_var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
        if [ -z "$${!secret_var:-}" ]; then
          val="$$(buildkite-agent secret get "$$secret_var" 2>/dev/null || true)"
          export "$$secret_var=$$val"
        fi
      done
      if [ -z "$${ANDROID_KEYSTORE_BASE64:-}"   ] || \
         [ -z "$${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
         [ -z "$${ANDROID_KEY_ALIAS:-}"         ] || \
         [ -z "$${ANDROID_KEY_PASSWORD:-}"      ]; then
        echo "Missing one or more Android signing secrets."
        exit 1
      fi

      # ── npm install (needed again since each step has a fresh workspace) ─────
      npm ci --legacy-peer-deps --prefer-offline --no-audit

      # ── Expo prebuild (regenerate android/ for this step's workspace) ────────
      SHOULD_PREBUILD="$$(buildkite-agent meta-data get should_prebuild)"
      if [ "$$SHOULD_PREBUILD" = "true" ]; then
        npx expo prebuild --platform android
      fi

      # ── Android permissions validation ───────────────────────────────────────
      MANIFEST="android/app/src/main/AndroidManifest.xml"
      if [ ! -f "$$MANIFEST" ]; then
        echo "AndroidManifest.xml not found at $$MANIFEST — prebuild may have failed."
        exit 1
      fi
      FORBIDDEN=(
        "android.permission.RECORD_AUDIO"
        "android.permission.SYSTEM_ALERT_WINDOW"
        "android.permission.READ_EXTERNAL_STORAGE"
        "android.permission.WRITE_EXTERNAL_STORAGE"
      )
      for perm in "$${FORBIDDEN[@]}"; do
        if awk -v perm="$$perm" '
          /<uses-permission/ && index($$0, "android:name=\"" perm "\"") &&
          index($$0, "tools:node=\"remove\"") == 0 { found=1 }
          END { exit found ? 0 : 1 }
        ' "$$MANIFEST"; then
          echo "Forbidden permission present in manifest: $$perm"
          exit 1
        fi
      done
      echo "All permission checks passed."

      # ── Keystore setup ───────────────────────────────────────────────────────
      mkdir -p android/app/keystores
      echo "$$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/release.keystore

      sed -i '/^MYAPP_UPLOAD_/d
              /^android.packagingOptions.pickFirsts=/d
              /^org.gradle.parallel=/d
              /^org.gradle.caching=/d
              /^org.gradle.daemon=/d
              /^org.gradle.workers.max=/d
              /^org.gradle.jvmargs=/d
              /^org.gradle.configuration-cache/d
              /^kotlin.compiler.execution.strategy=/d
              /^kotlin.incremental=/d' android/gradle.properties || true
      {
        echo "MYAPP_UPLOAD_STORE_FILE=app/keystores/release.keystore"
        echo "MYAPP_UPLOAD_KEY_ALIAS=$$ANDROID_KEY_ALIAS"
        echo "MYAPP_UPLOAD_STORE_PASSWORD=$$ANDROID_KEYSTORE_PASSWORD"
        echo "MYAPP_UPLOAD_KEY_PASSWORD=$$ANDROID_KEY_PASSWORD"
        echo "android.packagingOptions.pickFirsts=META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
        echo "org.gradle.daemon=false"
        echo "org.gradle.parallel=true"
        echo "org.gradle.workers.max=4"
        echo "org.gradle.caching=true"
        echo "kotlin.compiler.execution.strategy=in-process"
        echo "kotlin.incremental=false"
      } >> android/gradle.properties

      # ── Gradle build ─────────────────────────────────────────────────────────
      START_TS=$$(date +%s)
      cd android
      GRADLE_TASKS="assembleRelease --no-daemon --parallel --build-cache -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease"

      if [ "$${PUBLISH_BUILD_SCAN:-false}" = "true" ]; then
        ./gradlew $$GRADLE_TASKS --scan \
          -Dscan.termsOfServiceUrl=https://gradle.com/terms-of-service \
          -Dscan.termsOfServiceAgree=yes
      else
        ./gradlew $$GRADLE_TASKS
      fi

      END_TS=$$(date +%s)
      LOCAL_BUILD_SECONDS=$$((END_TS - START_TS))
      echo "Gradle build took $${LOCAL_BUILD_SECONDS}s"
      buildkite-agent meta-data set local_build_seconds "$$LOCAL_BUILD_SECONDS"

      rm -f android/app/keystores/release.keystore || true

  - label: ":github: Create GitHub release"
    key: github-release
    depends_on: gradle-build
    # Runs on tagged builds, or when FORCE_RELEASE=true is set manually
    if: build.tag != null || build.env("FORCE_RELEASE") == "true"
    agents:
      queue: default
    command: |
      set -euo pipefail

      # ── Resolve GitHub token ─────────────────────────────────────────────────
      if [ -z "$${GITHUB_TOKEN:-}" ]; then
        export GITHUB_TOKEN="$$(buildkite-agent secret get GITHUB_TOKEN 2>/dev/null || true)"
      fi
      if [ -z "$${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN is not set. Add it as a Buildkite secret or Pipeline env var."
        exit 1
      fi

      # ── Derive owner/repo ────────────────────────────────────────────────────
      REPO_SLUG="0xbasinas/bascybrosmobile"
      TAG="$${BUILDKITE_TAG:-build-$${BUILDKITE_BUILD_NUMBER}}"
      echo "Creating GitHub release $${TAG} for $${REPO_SLUG}"

      # ── Download the APK from Buildkite artifact storage ────────────────────
      mkdir -p dist
      buildkite-agent artifact download \
        "android/app/build/outputs/apk/release/app-release.apk" \
        dist/ \
        --build "$${BUILDKITE_BUILD_ID}"
      APK_PATH="dist/android/app/build/outputs/apk/release/app-release.apk"

      # ── Create the GitHub release (draft=false, prerelease auto-detected) ────
      IS_PRERELEASE="false"
      if echo "$${TAG}" | grep -qE '[-](alpha|beta|rc)'; then
        IS_PRERELEASE="true"
      fi

      RELEASE_PAYLOAD="$$(cat <<JSON
      {
        "tag_name": "$${TAG}",
        "name": "$${TAG}",
        "body": "Android APK built by Buildkite [#$${BUILDKITE_BUILD_NUMBER}]($${BUILDKITE_BUILD_URL})",
        "draft": false,
        "prerelease": $${IS_PRERELEASE}
      }
      JSON
      )"

      RELEASE_RESPONSE="$$(curl -sf \
        -X POST \
        -H "Authorization: Bearer $${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/$${REPO_SLUG}/releases" \
        -d "$${RELEASE_PAYLOAD}")"

      UPLOAD_URL="$$(echo "$${RELEASE_RESPONSE}" \
        | grep -o '"upload_url":"[^"]*"' \
        | head -1 \
        | sed 's/"upload_url":"//;s/".*//' \
        | sed 's/{?name,label}//')"

      if [ -z "$${UPLOAD_URL}" ]; then
        echo "Failed to get upload_url from GitHub response:"
        echo "$${RELEASE_RESPONSE}"
        exit 1
      fi

      # ── Upload the APK as a release asset ────────────────────────────────────
      APK_NAME="bascybrosmobile-$${TAG}.apk"
      curl -sf \
        -X POST \
        -H "Authorization: Bearer $${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        -H "Content-Type: application/vnd.android.package-archive" \
        "$${UPLOAD_URL}?name=$${APK_NAME}" \
        --data-binary "@$${APK_PATH}" > /dev/null

      echo "GitHub release $${TAG} created with $${APK_NAME}"
      echo "https://github.com/$${REPO_SLUG}/releases/tag/$${TAG}"

  - label: ":cloud: EAS cloud benchmark (optional)"
    key: eas-benchmark
    depends_on: setup
    if: build.env("COMPARE_WITH_EAS") == "true"
    agents:
      queue: default
    artifact_paths:
      - "dist/eas-preview.apk"
    command: |
      set -euo pipefail

      if [ -z "$${EXPO_TOKEN:-}" ]; then
        echo "EAS benchmark skipped: EXPO_TOKEN is not configured."
        buildkite-agent meta-data set eas_build_status  "skipped-missing-expo-token"
        buildkite-agent meta-data set eas_build_seconds "0"
        exit 0
      fi

      START_TS=$$(date +%s)
      JSON_OUTPUT="$$(npx eas-cli build \
        --platform android \
        --profile preview \
        --non-interactive \
        --wait \
        --json)"
      END_TS=$$(date +%s)
      EAS_BUILD_SECONDS=$$((END_TS - START_TS))

      mkdir -p dist
      echo "$$JSON_OUTPUT" > dist/eas-build.json

      BUILD_ID="$$(node -e '
        const fs=require("fs");
        const o=JSON.parse(fs.readFileSync("dist/eas-build.json","utf8"));
        const id=Array.isArray(o)?o[0]?.id:o?.id;
        if(!id){process.exit(1)}
        process.stdout.write(id);
      ')"

      npx eas-cli build:download \
        --platform android \
        --id "$$BUILD_ID" \
        --path dist/eas-preview.apk

      buildkite-agent meta-data set eas_build_status  "completed"
      buildkite-agent meta-data set eas_build_seconds "$$EAS_BUILD_SECONDS"
      echo "EAS build took $${EAS_BUILD_SECONDS}s"
